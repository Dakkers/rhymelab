# Monorepo workspace. See the reference layout in Dakkers/dimensionz-legacy.
packages:
  - app/frontend/web
  - app/backend/api
  - packages/core
  - packages/api-contract
  - packages/fixtures

minimumReleaseAge: 1440

minimumReleaseAgeExclude:
  - "@saintly-software/baritone"

blockExoticSubdeps: true

trustPolicy: "no-downgrade"

trustPolicyExclude:
  - "undici-types@6.21.0"
  - "semver@6.3.1"

savePrefix: ""

allowBuilds:
  esbuild: true
  lightningcss: true
  workerd: true
  prisma: true
  "@prisma/client": true
  "@prisma/engines": true
  sharp: false
  msw: false
  prisma-zod-generator: true
