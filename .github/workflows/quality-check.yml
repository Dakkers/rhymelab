name: quality check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Format check
        run: pnpm fmt:check

      - name: Lint check
        run: pnpm lint:check

      # worker-configuration.d.ts is gitignored but tsconfig references it.
      - name: Generate Cloudflare types
        run: pnpm cf-typegen

      - name: Typecheck
        run: pnpm typecheck

  # Excludes web (needs Playwright) and api integration tests (need Postgres).
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      # api unit tests import the generated client; no DB needed.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Unit tests
        run: pnpm test:unit

  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rhymelab
          POSTGRES_PASSWORD: rhymelab
          POSTGRES_DB: rhymelab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Process env wins over the committed .env; dotenv won't override it.
      DATABASE_URL: postgresql://rhymelab:rhymelab@localhost:5432/rhymelab

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --filter @rhymelab/database exec prisma migrate deploy

      - name: Integration tests
        run: pnpm test:integration

  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm --filter @rhymelab/web exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Smoke tests
        run: pnpm test:smoke

  e2e-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rhymelab
          POSTGRES_PASSWORD: rhymelab
          POSTGRES_DB: rhymelab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rhymelab:rhymelab@localhost:5432/rhymelab
      APP_PASSWORD: smoke-test-password
      E2E_APP_PASSWORD: smoke-test-password

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: pnpm --filter @rhymelab/web exec playwright install --with-deps chromium

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Generate Cloudflare types
        run: pnpm cf-typegen

      - name: Apply migrations
        run: pnpm --filter @rhymelab/database exec prisma migrate deploy

      - name: Start API
        run: |
          pnpm start:api > api.log 2>&1 &
          npx --yes wait-on --timeout 60000 tcp:localhost:4000

      # Playwright's webServer starts the web app itself.
      - name: E2E tests
        run: pnpm --filter @rhymelab/web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            app/frontend/web/playwright-report
            api.log
