name: quality check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm fmt:check

      - name: Lint check
        run: pnpm lint:check

      # `worker-configuration.d.ts` is generated (gitignored) but referenced by
      # tsconfig, so regenerate it from the bindings before typechecking.
      - name: Generate Cloudflare types
        run: pnpm cf-typegen

      - name: Typecheck
        run: pnpm typecheck

  # Node unit tests (core + api). Kept separate from quality-check so a test
  # failure and a lint/type failure surface independently. Deliberately excludes
  # the web package (browser-mode vitest, needs Playwright) and the api
  # DB-backed integration tests (need Postgres) — those want their own jobs.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The api unit tests import the generated Prisma client, so it must exist
      # before vitest runs. `prisma generate` needs no database connection.
      - name: Generate Prisma client
        run: pnpm --filter @rhymelab/api db:generate

      - name: Unit tests
        run: pnpm test:unit

  # DB-backed integration tests (api). Runs against a throwaway Postgres service
  # container, migrated fresh each run. Separate from unit-tests so the fast,
  # DB-free feedback isn't gated behind spinning up a database.
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rhymelab
          POSTGRES_PASSWORD: rhymelab
          POSTGRES_DB: rhymelab
        ports:
          - 5432:5432
        # Hold the job until Postgres accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Points at the service above. Set in the process env so it wins over the
      # committed .env default (dotenv doesn't override an existing variable),
      # for both `prisma migrate deploy` and the tests.
      DATABASE_URL: postgresql://rhymelab:rhymelab@localhost:5432/rhymelab

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rhymelab/api db:generate

      # `migrate deploy` applies the committed migrations only (no shadow DB, no
      # prompts) — the right command for CI, unlike the `migrate dev` used locally.
      - name: Apply migrations
        run: pnpm --filter @rhymelab/api exec prisma migrate deploy

      - name: Integration tests
        run: pnpm test:integration
